<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="visual-title visual-desc">
  <title id="visual-title">Distributed Data Intelligence Platform — LinkedIn Data Product Journey</title>
  <desc id="visual-desc">Two product journeys. Standalone Content batches use Java, SeaweedFS Bronze, Spark Silver and Gold. Gold serves DuckDB, REST and React; publisher-reference CSV enrichment serves standalone DuckDB. Managed Reliability uses registered synthetic JSONL or Parquet batches and versioned service CSV, run submission, a fixed worker, Spark and independent verification to produce verified immutable Parquet and DuckDB reports. Managed Content execution is planned. Native execution recovery resolution remains unfinished. No real production-monitoring or benchmark claim is made.</desc>
  <metadata>LinkedIn presentation variant derived from the approved data-product-journey.svg technical illustration. Original artwork and technical documentation remain unchanged. Live editable vector text; local standard fonts; no external assets.</metadata>
