<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="visual-title visual-desc">
  <title id="visual-title">Distributed Data Intelligence Platform — Data Product Journey</title>
  <desc id="visual-desc">Two implemented data-product paths. Standalone Content batches ingest RSS and Atom into SeaweedFS Bronze, then Spark Silver and Gold. Gold serves DuckDB reports, REST APIs and React views. A versioned publisher CSV joins Gold in standalone Spark Content enrichment, consumed through DuckDB reports and CLI. Managed Reliability uses registered synthetic JSONL or Parquet batches and a versioned service CSV, durable run submission, one fixed-profile worker, Spark transformations and independent verification to produce immutable Parquet and DuckDB analytics. Managed Content execution is planned. C3b recovery handoff is internal; native reconciliation remains unfinished. No benchmark or real production-monitoring claim is made.</desc>
  <metadata>Evidence baseline: owner commit 217a35c; E5 C3b 847511e. Illustration created 2026-10-22. All artwork is local editable vector; no external fonts or assets.</metadata>
