name: PostgreSQL integration partition

on:
  workflow_call:
    inputs:
      partition:
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Execute PostgreSQL partition
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: ddip_test
          POSTGRES_USER: ddip_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddip_test -d ddip_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
      POSTGRES_PARTITION: ${{ inputs.partition }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Build prebuilt Java RSS and Bronze adapters for managed acceptance
        if: ${{ inputs.partition == 'ingestion' || inputs.partition == 'gold' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f ingestion/pom.xml package -DskipTests
      - name: Start isolated Bronze acceptance storage
        if: ${{ inputs.partition == 'ingestion' || inputs.partition == 'gold' }}
        run: |
          docker run --detach --name "ddip-ci-bronze-${POSTGRES_PARTITION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --hostname seaweedfs --publish 127.0.0.1:8333:8333 \
            --env AWS_ACCESS_KEY_ID=ci_test_only --env AWS_SECRET_ACCESS_KEY=ci_test_only \
            --env S3_BUCKET=ddip-d2 \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -dir=/data -ip=seaweedfs -s3.port=8333 -s3.port.iceberg=0 -s3.port.lance=0 \
            -webdav=false -admin.ui=false -s3.autoCreateBucket=false -s3.allowDeleteBucketNotEmpty=false
      - name: Verify the complete partition and its actual integration reports
        env:
          DDIP_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          DDIP_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ddip_test
          DDIP_TEST_DB_USER: ddip_test
          DDIP_TEST_DB_PASSWORD: ci_test_only
          BRONZE_S3_ENDPOINT: http://127.0.0.1:8333
          BRONZE_S3_REGION: us-east-1
          BRONZE_S3_BUCKET: ddip-d2
          BRONZE_S3_ACCESS_KEY: ci_test_only
          BRONZE_S3_SECRET_KEY: ci_test_only
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export DDIP_TEST_PYTHON="$(command -v python)"
          selection=$(python3 .github/ci/postgres_partitions.py --partition "$POSTGRES_PARTITION")
          # Units execute once in core; Failsafe integration execution is always enabled.
          skip_units=true
          if [ "$POSTGRES_PARTITION" = core ]; then skip_units=false; fi
          mvn -B -ntp -f services/content-api/pom.xml verify -Ppostgres \
            "-Dit.test=$selection" "-DskipUnitTests=$skip_units"
          python3 .github/ci/postgres_partitions.py --partition "$POSTGRES_PARTITION" \
            --reports services/content-api/target/failsafe-reports
      - name: Remove isolated Bronze acceptance storage
        if: ${{ always() && (inputs.partition == 'ingestion' || inputs.partition == 'gold') }}
        run: docker rm --force --volumes "ddip-ci-bronze-${POSTGRES_PARTITION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
