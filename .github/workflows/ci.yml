name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      classified: ${{ steps.classify.outputs.classified }}
      mode: ${{ steps.classify.outputs.mode }}
      ingestion: ${{ steps.classify.outputs.ingestion }}
      processing_python: ${{ steps.classify.outputs.processing_python }}
      analytics_jdbc: ${{ steps.classify.outputs.analytics_jdbc }}
      content_postgres: ${{ steps.classify.outputs.content_postgres }}
      analytics_http: ${{ steps.classify.outputs.analytics_http }}
    steps:
      - name: Check out complete event history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify with trusted base policy
        id: classify
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          # Read policy from the immutable base commit, never execute PR policy/content.
          # The first deployment has no base policy yet and must validate everything.
          if git cat-file -e "$POLICY_SHA:.github/ci/classify.py"; then
            git show "$POLICY_SHA:.github/ci/classify.py" > "$RUNNER_TEMP/ddip-classify.py"
            python3 -I -B "$RUNNER_TEMP/ddip-classify.py"
          else
            {
              echo 'classified=true'
              echo 'mode=full'
              for job in ingestion processing_python analytics_jdbc content_postgres analytics_http; do
                echo "$job=true"
              done
            } >> "$GITHUB_OUTPUT"
            echo 'Trusted policy unavailable; full regression required.' >> "$GITHUB_STEP_SUMMARY"
          fi

  documentation:
    name: Documentation and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install check tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Markdown formatting and local links
        run: npm run lint:markdown
      - name: Check repository hygiene
        run: npm run check:hygiene
      - name: Check complete PostgreSQL integration inventory
        run: python3 .github/ci/postgres_partitions.py
      - name: Test CI classification and required gate
        run: python3 -I -B -m unittest discover -s .github/ci/tests -v

  ingestion:
    name: Java 21 ingestion and Bronze storage
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.ingestion != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Maven unit tests with runner JDK 21
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f ingestion/pom.xml verify
      - name: Check batch launch script arguments without ingestion
        run: bash scripts/test-run-batch.sh

  processing_python:
    name: Python 3.12 processing, Spark and DuckDB
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.processing_python != 'false') }}
    runs-on: ubuntu-24.04
    # Phase 1 main hosted test step: 18m21s; retain the existing timeout.
    timeout-minutes: 30
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Run all processing tests with runner JDK 21
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          python --version
          java -version
          python -m unittest discover -s processing/tests -v

  analytics_jdbc:
    name: Java 21 JDBC and Gold fixture compatibility
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.analytics_jdbc != 'false') }}
    runs-on: ubuntu-24.04
    # Includes one fresh Spark fixture generation, not the Python test suite.
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Compare Java JDBC POC with Python Gold reports
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          PYTHONPATH=processing:processing/tests python services/api/tests/generate_fixtures.py --output services/api/target/fixtures
          mvn -B -ntp -f services/api/pom.xml verify

  content_postgres_core:
    name: PostgreSQL core integration
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.content_postgres != 'false') }}
    uses: ./.github/workflows/postgres-partition.yml
    with:
      partition: core

  content_postgres_reliability:
    name: PostgreSQL reliability integration
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.content_postgres != 'false') }}
    uses: ./.github/workflows/postgres-partition.yml
    with:
      partition: reliability

  content_postgres_ingestion:
    name: PostgreSQL ingestion integration
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.content_postgres != 'false') }}
    uses: ./.github/workflows/postgres-partition.yml
    with:
      partition: ingestion

  content_postgres_gold:
    name: PostgreSQL gold integration
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.content_postgres != 'false') }}
    uses: ./.github/workflows/postgres-partition.yml
    with:
      partition: gold

  content_postgres_content_recovery:
    name: PostgreSQL Content recovery integration
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.content_postgres != 'false') }}
    uses: ./.github/workflows/postgres-partition.yml
    with:
      partition: content_recovery

  content_postgres:
    name: Java 21 PostgreSQL execution and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, content_postgres_core, content_postgres_reliability, content_postgres_ingestion, content_postgres_gold, content_postgres_content_recovery]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.content_postgres != 'false') }}
    steps:
      - name: Require every selected PostgreSQL partition
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os

          def check_postgres(needs):
              partitions = ('content_postgres_core', 'content_postgres_reliability', 'content_postgres_ingestion', 'content_postgres_gold', 'content_postgres_content_recovery')
              if not isinstance(needs, dict) or set(needs) != {'changes', *partitions}:
                  return False
              changes = needs['changes']
              if not isinstance(changes, dict) or changes.get('result') != 'success':
                  return False
              outputs = changes.get('outputs')
              if not isinstance(outputs, dict) or outputs.get('classified') != 'true' or outputs.get('mode') not in ('full', 'selective') or outputs.get('content_postgres') != 'true':
                  return False
              return all(isinstance(needs[p], dict) and needs[p].get('result') == 'success' for p in partitions)

          if __name__ == '__main__':
              raise SystemExit(0 if check_postgres(json.loads(os.environ['NEEDS_JSON'])) else 1)
          PY

  analytics_http:
    name: Java 21 Spring Boot analytics HTTP and native integration
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.analytics_http != 'false') }}
    runs-on: ubuntu-24.04
    # Phase 1 main hosted job: 2m15s, including its own Gold fixture generation.
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Generate synthetic Gold fixtures for HTTP and native checks
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          PYTHONPATH=processing:processing/tests python services/api/tests/generate_fixtures.py --output services/api/target/fixtures
      - name: Verify all Spring Boot analytics APIs against synthetic Gold fixtures
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f services/content-api/pom.xml verify -Pintegration -Danalytics.python="$(command -v python)"

  processing:
    # Required by the main ruleset: retain this exact, unique check name.
    name: Python 3.12, local Spark processing and DuckDB analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, ingestion, processing_python, analytics_jdbc, content_postgres, analytics_http]
    # Run after failed/skipped dependencies too; an implicitly skipped gate is unsafe.
    if: ${{ always() }}
    steps:
      - name: Require successful classification and every selected backend suite
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os

          def check_gate(needs, event_name, event_ref):
              jobs = ('ingestion', 'processing_python', 'analytics_jdbc', 'content_postgres', 'analytics_http')
              if event_name not in ('pull_request', 'push'):
                  return False
              if not isinstance(needs, dict) or set(needs) != {'changes', *jobs}:
                  return False
              changes = needs['changes']
              if not isinstance(changes, dict) or changes.get('result') != 'success':
                  return False
              outputs = changes.get('outputs')
              if not isinstance(outputs, dict) or outputs.get('classified') != 'true':
                  return False
              if outputs.get('mode') not in ('full', 'selective'):
                  return False
              if event_name == 'push' and (event_ref != 'refs/heads/main' or outputs['mode'] != 'full'):
                  return False
              for job in jobs:
                  required = outputs.get(job)
                  result = needs[job].get('result') if isinstance(needs[job], dict) else None
                  print(f'{job}: required={required}, result={result}')
                  if required not in ('true', 'false'):
                      return False
                  if outputs['mode'] == 'full' and required != 'true':
                      return False
                  expected = 'success' if required == 'true' else 'skipped'
                  if result != expected:
                      return False
              return True

          if __name__ == '__main__':
              passed = check_gate(json.loads(os.environ['NEEDS_JSON']), os.environ['EVENT_NAME'], os.environ['EVENT_REF'])
              raise SystemExit(0 if passed else 1)
          PY

  frontend:
    name: React publisher dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint TypeScript, React and accessibility
        run: npm run lint
      - name: Run isolated unit and component tests
        run: npm test
      - name: Build production dashboard
        run: npm run build
