name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install check tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Markdown formatting and local links
        run: npm run lint:markdown
      - name: Check repository hygiene
        run: npm run check:hygiene

  ingestion:
    name: Java 21 ingestion and Bronze storage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Maven unit tests with runner JDK 21
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f ingestion/pom.xml verify
      - name: Check batch launch script arguments without ingestion
        run: bash scripts/test-run-batch.sh

  processing_python:
    name: Python 3.12 processing, Spark and DuckDB
    runs-on: ubuntu-24.04
    # C3c.4 PR hosted baseline: 13m19s for the processing test step.
    timeout-minutes: 30
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Run all processing tests with runner JDK 21
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          python --version
          java -version
          python -m unittest discover -s processing/tests -v

  analytics_jdbc:
    name: Java 21 JDBC and Gold fixture compatibility
    runs-on: ubuntu-24.04
    # Includes one fresh Spark fixture generation, not the Python test suite.
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Compare Java JDBC POC with Python Gold reports
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          PYTHONPATH=processing:processing/tests python services/api/tests/generate_fixtures.py --output services/api/target/fixtures
          mvn -B -ntp -f services/api/pom.xml verify

  content_postgres:
    name: Java 21 PostgreSQL execution and recovery
    runs-on: ubuntu-24.04
    # C3c.4 PR hosted baseline: 33m52s; retain headroom for native/process lifecycle cases.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: ddip_test
          POSTGRES_USER: ddip_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddip_test -d ddip_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Verify PostgreSQL migrations, persistence and isolated runtime roles
        env:
          DDIP_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ddip_test
          DDIP_TEST_DB_USER: ddip_test
          DDIP_TEST_DB_PASSWORD: ci_test_only
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export DDIP_TEST_PYTHON="$(command -v python)"
          mvn -B -ntp -f services/content-api/pom.xml verify -Ppostgres

  analytics_http:
    name: Java 21 Spring Boot analytics HTTP and native integration
    runs-on: ubuntu-24.04
    # C3c.4 PR hosted HTTP step: 43s; this job also creates its own Gold fixtures.
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      TZ: UTC
      PYTHONPATH: processing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            processing/requirements.txt
            processing/requirements-bronze.txt
            processing/requirements-analytics.txt
      - name: Install pinned processing dependencies
        run: python -m pip install -r processing/requirements-bronze.txt -r processing/requirements-analytics.txt
      - name: Generate synthetic Gold fixtures for HTTP and native checks
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export PYSPARK_PYTHON="$(command -v python)"
          PYTHONPATH=processing:processing/tests python services/api/tests/generate_fixtures.py --output services/api/target/fixtures
      - name: Verify all Spring Boot analytics APIs against synthetic Gold fixtures
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f services/content-api/pom.xml verify -Pintegration -Danalytics.python="$(command -v python)"

  processing:
    # Required by the main ruleset: retain this exact, unique check name.
    name: Python 3.12, local Spark processing and DuckDB analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [ingestion, processing_python, analytics_jdbc, content_postgres, analytics_http]
    # Run after failed/skipped dependencies too; an implicitly skipped gate is unsafe.
    if: ${{ always() }}
    steps:
      - name: Require every backend validation job to succeed
        env:
          INGESTION_RESULT: ${{ needs.ingestion.result }}
          PYTHON_RESULT: ${{ needs.processing_python.result }}
          JDBC_RESULT: ${{ needs.analytics_jdbc.result }}
          POSTGRES_RESULT: ${{ needs.content_postgres.result }}
          HTTP_RESULT: ${{ needs.analytics_http.result }}
        run: |
          failed=0
          for entry in \
            "ingestion=$INGESTION_RESULT" \
            "processing_python=$PYTHON_RESULT" \
            "analytics_jdbc=$JDBC_RESULT" \
            "content_postgres=$POSTGRES_RESULT" \
            "analytics_http=$HTTP_RESULT"
          do
            printf '%s\n' "$entry"
            if [[ "${entry#*=}" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

  frontend:
    name: React publisher dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint TypeScript, React and accessibility
        run: npm run lint
      - name: Run isolated unit and component tests
        run: npm test
      - name: Build production dashboard
        run: npm run build
