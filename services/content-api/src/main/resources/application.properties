spring.application.name=content-api
spring.main.log-startup-info=false
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.tomcat.threads.max=32
server.tomcat.max-connections=64
server.tomcat.accept-count=16
server.tomcat.connection-timeout=5s
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.diskspace.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Analytics is deliberately database-free. Database roles are explicitly selected.
ddip.role=${DDIP_ROLE:analytics}
ddip.database.url=${DDIP_DB_URL:}
ddip.database.username=${DDIP_DB_USER:}
ddip.database.password=${DDIP_DB_PASSWORD:}
ddip.installation-id=${DDIP_INSTALLATION_ID:}
ddip.worker.python=${DDIP_WORKER_PYTHON:}
ddip.worker.java-home=${DDIP_WORKER_JAVA_HOME:}
ddip.worker.processing-root=${DDIP_WORKER_PROCESSING_ROOT:}
# Native driver/pool/migration exceptions can contain connection details. Only fixed diagnostics escape.
logging.level.com.zaxxer.hikari=OFF
logging.level.org.flywaydb=OFF
logging.level.org.postgresql=OFF

# Management source controls exist only in the api role. Catalog contains IDs/reviewed references, not uploads.
ddip.management.catalog=${DDIP_MANAGEMENT_CATALOG:}
ddip.management.cursor-key=${DDIP_MANAGEMENT_CURSOR_KEY:}

# Private fixed operator import boundary; never exposes HTTP routes.
ddip.import.catalog=${DDIP_IMPORT_CATALOG:}
ddip.import.action=${DDIP_IMPORT_ACTION:import}
ddip.import.recovery-id=${DDIP_IMPORT_RECOVERY_ID:}
ddip.import.quiescence-confirmed=${DDIP_IMPORT_QUIESCENCE_CONFIRMED:false}
